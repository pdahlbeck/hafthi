<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18232d"/>
      <stop offset="0.48" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e8f1f7"/>
      <stop offset="1" stop-color="#b8c8d3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect x="30" y="30" width="452" height="452" rx="102"
        fill="url(#bg)" stroke="#456174" stroke-width="4" filter="url(#shadow)"/>
  <rect x="43" y="43" width="426" height="426" rx="90"
        fill="none" stroke="#8fb4ca" stroke-opacity="0.18" stroke-width="3"/>

  <text x="256" y="365"
        text-anchor="middle"
        font-family="DejaVu Serif, Noto Serif, serif"
        font-size="332"
        font-weight="400"
        fill="url(#silver)"
        stroke="#f7fbff"
        stroke-width="1.2"
        paint-order="stroke"
        filter="url(#glow)">þ</text>
</svg>
