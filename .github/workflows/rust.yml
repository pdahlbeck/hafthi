name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Wayland build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev desktop-file-utils
      - run: desktop-file-validate assets/hafthi.desktop
      - run: sh tests/ghost-tasks.sh
      - run: cargo check
      - run: cargo test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n run-podman.sh
      - run: docker build --file Containerfile --tag hafthi:ci .
      - run: docker run --rm --entrypoint /bin/sh hafthi:ci -c 'ldd /usr/local/bin/hafthi | tee /tmp/ldd && ! grep -q "not found" /tmp/ldd'
